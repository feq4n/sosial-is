    <script>
      /* Tema: saxlanılmış seçim (light | dark | system). Yoxdursa sistem teması. Səhifə çəkilməzdən əvvəl tətbiq olunur (yanıb-sönmə olmasın). */
      try {
        var p = localStorage.getItem('sosial-is-theme');
        var d = p === 'dark' || (p !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var r = document.documentElement;
        if (d) r.classList.add('dark');
        r.style.colorScheme = d ? 'dark' : 'light';
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', d ? '#0f1311' : '#087A50');
      } catch (e) {}
    </script>
